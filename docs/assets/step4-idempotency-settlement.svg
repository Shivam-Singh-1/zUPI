<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="settledGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes reqAEnter {
        0% { transform: translateX(-40px); opacity: 0; }
        40%, 100% { transform: translateX(0px); opacity: 1; }
      }
      @keyframes reqBDeflect {
        0% { transform: translate(-30px, 0); opacity: 0; }
        40% { transform: translate(0px, 0); opacity: 1; }
        70%, 100% { transform: translate(40px, 30px); opacity: 0.3; }
      }
      @keyframes shieldPulse {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; filter: drop-shadow(0 0 8px rgba(245,158,11,0.8)); }
      }
      @keyframes checkmarkPop {
        0%, 30% { transform: scale(0.8); opacity: 0.2; }
        60%, 100% { transform: scale(1.05); opacity: 1; }
      }
      .req-a { animation: reqAEnter 3.5s ease-in-out infinite; }
      .req-b { animation: reqBDeflect 3.5s ease-in-out infinite; }
      .cas-shield { animation: shieldPulse 2s ease-in-out infinite; }
      .settled-stamp { transform-origin: 755px 245px; animation: checkmarkPop 3.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="340" rx="16" fill="url(#bgGrad4)" stroke="#30363d" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(32, 34)">
    <circle cx="10" cy="10" r="10" fill="#38bdf8" fill-opacity="0.2" />
    <text x="10" y="15" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4</text>
    <text x="32" y="15" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" letter-spacing="0.3">STEP 4: ATOMIC CAS IDEMPOTENCY GATE &amp; DETERMINISTIC LEDGER SETTLE</text>
    <rect x="730" y="0" width="118" height="22" rx="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="789" y="15" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" text-anchor="middle">✓ ACID COMMITTED</text>
  </g>

  <!-- Left: Inbound Requests A & B -->
  <g transform="translate(48, 80)">
    <!-- Request A (Winner) -->
    <g class="req-a">
      <rect width="180" height="90" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <text x="14" y="24" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">Request A (T+0ms)</text>
      <text x="14" y="44" fill="#94a3b8" font-family="monospace" font-size="9">Bridge: phone-bridge</text>
      <text x="14" y="62" fill="#e2e8f0" font-family="monospace" font-size="9">Hash: 51c858462984...</text>
      <rect x="14" y="68" width="94" height="16" rx="4" fill="#047857" />
      <text x="61" y="80" fill="#ffffff" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">FIRST TO ARRIVE</text>
    </g>

    <!-- Request B (Duplicate) -->
    <g class="req-b" transform="translate(0, 110)">
      <rect width="180" height="90" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="14" y="24" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="700">Request B (T+2ms)</text>
      <text x="14" y="44" fill="#94a3b8" font-family="monospace" font-size="9">Bridge: stranger-2</text>
      <text x="14" y="62" fill="#e2e8f0" font-family="monospace" font-size="9">Hash: 51c858462984...</text>
      <rect x="14" y="68" width="94" height="16" rx="4" fill="#b45309" />
      <text x="61" y="80" fill="#ffffff" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">DUPLICATE HASH</text>
    </g>
  </g>

  <!-- Middle: Atomic CAS Idempotency Shield -->
  <g transform="translate(268, 80)">
    <rect width="210" height="220" rx="14" fill="url(#gateGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="210" height="34" rx="14" fill="#0f172a" />
    <text x="105" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ATOMIC CAS GATE</text>

    <!-- Shield Graphic -->
    <g transform="translate(75, 45)">
      <path d="M 30 10 L 55 20 C 55 50 30 65 30 65 C 30 65 5 50 5 20 Z" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5" class="cas-shield" filter="url(#shieldGlow)" />
      <text x="30" y="42" fill="#fbbf24" font-family="monospace" font-size="14" text-anchor="middle">🛡️</text>
    </g>

    <text x="105" y="125" fill="#e2e8f0" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">Synchronous Map CAS</text>

    <!-- Outcome A: Claim Success -->
    <rect x="16" y="140" width="178" height="28" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="24" y="158" fill="#34d399" font-family="monospace" font-size="9" font-weight="700">✓ claim(hash) == true</text>

    <!-- Outcome B: Duplicate Dropped -->
    <rect x="16" y="176" width="178" height="28" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
    <text x="24" y="194" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="700">✕ claim(hash) == false</text>

    <text x="105" y="222" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" text-anchor="middle">→ DUPLICATE_DROPPED (0ms)</text>
  </g>

  <!-- Connective Arrow from CAS to Ledger -->
  <path d="M 480 155 L 535 155" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="535,150 545,155 535,160" fill="#10b981" />

  <!-- Right: Atomic Database Settlement Ledger -->
  <g transform="translate(528, 80)">
    <rect width="304" height="220" rx="14" fill="url(#settledGrad)" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="304" height="34" rx="14" fill="#065f46" />
    <text x="16" y="22" fill="#ecfdf5" font-family="monospace" font-size="11" font-weight="700">SQLite ACID Settlement Engine</text>

    <!-- Balance Updates Box -->
    <rect x="14" y="46" width="276" height="74" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <text x="24" y="68" fill="#8b949e" font-family="monospace" font-size="10">Alice: <tspan fill="#f87171">₹5000.00</tspan> → <tspan fill="#34d399" font-weight="700">₹4750.00</tspan> (-₹250)</text>
    <text x="24" y="90" fill="#8b949e" font-family="monospace" font-size="10">Bob:   <tspan fill="#94a3b8">₹1000.00</tspan> → <tspan fill="#34d399" font-weight="700">₹1250.00</tspan> (+₹250)</text>
    <text x="24" y="110" fill="#38bdf8" font-family="monospace" font-size="9">Exact Decimal.js (0 float drift)</text>

    <!-- Ledger Entry -->
    <rect x="14" y="130" width="276" height="72" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <text x="24" y="150" fill="#94a3b8" font-family="monospace" font-size="9">Nonce:    <tspan fill="#a78bfa">a7b8c9d0 (UNIQUE)</tspan></text>
    <text x="24" y="168" fill="#94a3b8" font-family="monospace" font-size="9">Hops:     <tspan fill="#e2e8f0">4 hops (SettledAt: 11:28)</tspan></text>
    <text x="24" y="186" fill="#94a3b8" font-family="monospace" font-size="9">Version:  <tspan fill="#38bdf8">Optimistic Lock v+1</tspan></text>

    <!-- Settled Stamp Graphic -->
    <g class="settled-stamp" transform="translate(230, 155)">
      <circle cx="16" cy="16" r="16" fill="#10b981" filter="url(#greenGlow)" />
      <path d="M 10 16 L 14 20 L 22 12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
