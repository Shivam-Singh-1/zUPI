<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="gateCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="settledCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="amberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes reqAForward {
        0%, 100% { transform: translateX(0); opacity: 1; }
        50% { transform: translateX(6px); opacity: 0.9; }
      }
      @keyframes shieldGlowPulse {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.4)); }
        50% { filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.8)); }
      }
      @keyframes stampBeat {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.6)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.9)); }
      }
      @keyframes streamArrow {
        0% { stroke-dashoffset: 24; }
        100% { stroke-dashoffset: 0; }
      }
      .anim-req-a { animation: reqAForward 2.5s ease-in-out infinite; }
      .shield-anim { transform-origin: 470px 145px; animation: shieldGlowPulse 2.5s ease-in-out infinite; }
      .stamp-anim { transform-origin: 915px 78px; animation: stampBeat 3s ease-in-out infinite; }
      .flow-arrow { stroke-dasharray: 6, 4; animation: streamArrow 1.2s linear infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="450" rx="16" fill="url(#bgGrad4)" stroke="#30363d" stroke-width="1.5" />

  <!-- Title Bar -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="26" height="26" rx="13" fill="#38bdf8" fill-opacity="0.2" />
    <text x="13" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text>
    <text x="36" y="19" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" letter-spacing="0.3">STEP 4: TWO-TIER CAS IDEMPOTENCY &amp; DETERMINISTIC SETTLEMENT</text>
    
    <rect x="740" y="2" width="220" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="850" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">✓ ACID COMMITTED (WAL MODE)</text>
  </g>

  <!-- COLUMN 1: INBOUND CONCURRENT REQUESTS (x=45, y=65, w=250, h=320) -->
  <g transform="translate(45, 65)">
    <!-- Request A (Winner) -->
    <g class="anim-req-a" transform="translate(0, 0)">
      <rect width="250" height="150" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.8" />
      <rect x="0" y="0" width="250" height="32" rx="10" fill="#065f46" />
      <text x="14" y="21" fill="#ecfdf5" font-family="monospace" font-size="11" font-weight="700">Request A (Arrives T+0ms)</text>
      <rect x="195" y="6" width="45" height="20" rx="4" fill="#047857" />
      <text x="217" y="20" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">1st</text>

      <text x="14" y="54" fill="#94a3b8" font-family="monospace" font-size="10">Bridge: <tspan fill="#38bdf8">phone-bridge</tspan></text>
      <text x="14" y="74" fill="#94a3b8" font-family="monospace" font-size="10">Hash:   <tspan fill="#6ee7b7">51c858462984...</tspan></text>
      <text x="14" y="94" fill="#a7f3d0" font-family="monospace" font-size="9.5">Bounty: <tspan fill="#34d399" font-weight="700">Claims ₹0.50 Reward</tspan></text>

      <rect x="14" y="114" width="222" height="22" rx="4" fill="#047857" />
      <text x="125" y="129" fill="#ecfdf5" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">ACQUIRES IDEMPOTENCY LOCK</text>
    </g>

    <!-- Request B (Duplicate) -->
    <g transform="translate(0, 168)">
      <rect width="250" height="150" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="0" y="0" width="250" height="32" rx="10" fill="#78350f" fill-opacity="0.6" />
      <text x="14" y="21" fill="#fef3c7" font-family="monospace" font-size="11" font-weight="700">Request B (Arrives T+2ms)</text>
      <rect x="195" y="6" width="45" height="20" rx="4" fill="#92400e" />
      <text x="217" y="20" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">2nd</text>

      <text x="14" y="54" fill="#94a3b8" font-family="monospace" font-size="10">Bridge: <tspan fill="#38bdf8">stranger-2</tspan></text>
      <text x="14" y="74" fill="#94a3b8" font-family="monospace" font-size="10">Hash:   <tspan fill="#fbbf24">51c858462984...</tspan></text>
      <text x="14" y="94" fill="#fbbf24" font-family="monospace" font-size="9.5">Bounty: <tspan fill="#f87171">₹0.00 (Duplicate)</tspan></text>

      <rect x="14" y="114" width="222" height="22" rx="4" fill="#78350f" />
      <text x="125" y="129" fill="#fef3c7" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">DUPLICATE DROPPED (0ms)</text>
    </g>
  </g>

  <!-- CONNECTORS: Column 1 to Column 2 (x=295 to 345) -->
  <line x1="300" y1="140" x2="340" y2="140" stroke="#10b981" stroke-width="3" class="flow-arrow" />
  <polygon points="340,135 350,140 340,145" fill="#10b981" />

  <line x1="300" y1="308" x2="340" y2="308" stroke="#f59e0b" stroke-width="3" class="flow-arrow" />
  <polygon points="340,303 350,308 340,313" fill="#f59e0b" />

  <!-- COLUMN 2: TWO-TIER ATOMIC CAS GATE (x=350, y=65, w=275, h=320) -->
  <g transform="translate(350, 65)">
    <rect width="275" height="320" rx="14" fill="url(#gateCardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="0" y="0" width="275" height="38" rx="14" fill="#0f172a" />
    <text x="137" y="23" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TWO-TIER CAS GATE</text>

    <!-- Tier 1: In-Memory Fast Path -->
    <rect x="14" y="48" width="247" height="66" rx="6" fill="#0b0f19" stroke="#38bdf8" stroke-width="1" />
    <text x="24" y="68" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">TIER 1: In-Memory Cache (0ms)</text>
    <text x="24" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">processedHashes.has(hash)</text>
    <text x="24" y="102" fill="#34d399" font-family="monospace" font-size="9">Sub-millisecond duplicate cutoff</text>

    <!-- Tier 2: Persistent SQLite WAL Table -->
    <rect x="14" y="122" width="247" height="88" rx="6" fill="#0b0f19" stroke="#10b981" stroke-width="1" />
    <text x="24" y="142" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">TIER 2: SQLite WAL Persistence</text>
    <text x="24" y="160" fill="#cbd5e1" font-family="monospace" font-size="9">TABLE processed_packets (</text>
    <text x="32" y="176" fill="#6ee7b7" font-family="monospace" font-size="8.5">packet_hash TEXT PRIMARY KEY,</text>
    <text x="32" y="192" fill="#94a3b8" font-family="monospace" font-size="8.5">processed_at TIMESTAMP )</text>
    <text x="24" y="204" fill="#a7f3d0" font-family="monospace" font-size="8.5">Survives power outages &amp; reboots!</text>

    <!-- Gate Outcome Paths -->
    <rect x="14" y="218" width="247" height="52" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="24" y="236" fill="#34d399" font-family="monospace" font-size="9.5" font-weight="700">✓ First Arrival → Lock Acquired</text>
    <text x="24" y="254" fill="#d1fae5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">Atomic INSERT into WAL + In-Memory Set</text>

    <!-- Bottom subtext -->
    <rect x="14" y="278" width="247" height="30" rx="4" fill="#1e293b" />
    <text x="137" y="297" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">✕ Duplicate → Dropped at Gate (0ms)</text>
  </g>

  <!-- CONNECTOR: CAS to Ledger (x=625 to 670) -->
  <line x1="630" y1="160" x2="665" y2="160" stroke="#10b981" stroke-width="3" class="flow-arrow" />
  <polygon points="665,155 675,160 665,165" fill="#10b981" />

  <!-- COLUMN 3: SQLITE ACID SETTLEMENT LEDGER (x=675, y=65, w=285, h=320) -->
  <g transform="translate(675, 65)">
    <rect width="285" height="320" rx="14" fill="url(#settledCardGrad)" stroke="#10b981" stroke-width="2" />
    
    <!-- Header with Stamp -->
    <rect x="0" y="0" width="285" height="38" rx="14" fill="#065f46" />
    <text x="16" y="23" fill="#ecfdf5" font-family="monospace" font-size="11" font-weight="700">ACID Settlement Engine</text>

    <!-- SETTLED Stamp in Header -->
    <g class="stamp-anim" transform="translate(215, 8)">
      <rect width="60" height="22" rx="4" fill="#10b981" stroke="#34d399" stroke-width="1" />
      <text x="30" y="15" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">SETTLED</text>
    </g>

    <!-- Sub-Box 1: Balance Updates + Bridge Bounty -->
    <rect x="14" y="48" width="257" height="114" rx="8" fill="#0b0f19" stroke="#30363d" stroke-width="1" />
    <text x="24" y="68" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600">ATOMIC 3-WAY TRANSFER</text>
    <line x1="24" y1="76" x2="261" y2="76" stroke="#30363d" stroke-width="1" />

    <text x="24" y="96" fill="#94a3b8" font-family="monospace" font-size="9.5">Alice:  <tspan fill="#f87171">₹5000</tspan> → <tspan fill="#34d399" font-weight="700">₹4750.00</tspan> (-₹250)</text>
    <text x="24" y="116" fill="#94a3b8" font-family="monospace" font-size="9.5">Bob:    <tspan fill="#94a3b8">₹1000</tspan> → <tspan fill="#34d399" font-weight="700">₹1250.00</tspan> (+₹250)</text>
    <text x="24" y="136" fill="#94a3b8" font-family="monospace" font-size="9.5">Bridge: <tspan fill="#38bdf8">phone-bridge</tspan> <tspan fill="#34d399" font-weight="700">+₹0.50 💰</tspan></text>
    <text x="24" y="152" fill="#a5b4fc" font-family="monospace" font-size="8.5">Table: bridge_rewards (Instant Credit)</text>

    <!-- Sub-Box 2: Reverse ACK Generation -->
    <rect x="14" y="170" width="257" height="96" rx="8" fill="#0b0f19" stroke="#30363d" stroke-width="1" />
    <text x="24" y="190" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600">REVERSE SETTLEMENT ACK</text>
    <line x1="24" y1="198" x2="261" y2="198" stroke="#30363d" stroke-width="1" />

    <text x="24" y="216" fill="#94a3b8" font-family="monospace" font-size="9.5">Status:    <tspan fill="#34d399" font-weight="700">"SETTLED"</tspan></text>
    <text x="24" y="234" fill="#94a3b8" font-family="monospace" font-size="9.5">Broadcast: <tspan fill="#6ee7b7">ACK emitted to Bridge</tspan></text>
    <text x="24" y="252" fill="#38bdf8" font-family="monospace" font-size="8.5">↺ Relays backward to purge mesh</text>

    <!-- Bottom note -->
    <rect x="14" y="274" width="257" height="34" rx="6" fill="#065f46" />
    <text x="142" y="291" fill="#ecfdf5" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">TRANSACTION PERMANENT</text>
    <text x="142" y="303" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" text-anchor="middle">Survives server restart without replay</text>
  </g>

  <!-- BOTTOM FOOTER CALLOUT (y=398) -->
  <g transform="translate(45, 398)">
    <rect width="915" height="38" rx="8" fill="#0b0f19" stroke="#30363d" stroke-width="1" />
    <text x="24" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">
      🔒 <tspan fill="#38bdf8" font-weight="700">End-to-End Integrity:</tspan> Two-tier gate stops double-spending in memory &amp; on disk; bridge reward credits automatically; Reverse ACK frees memory across all relaying devices.
    </text>
  </g>
</svg>
