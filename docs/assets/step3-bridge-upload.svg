<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="bridgeCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="serverCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="towerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes towerPulse {
        0% { r: 10px; opacity: 0.9; stroke-width: 2.5; }
        100% { r: 44px; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes streamMotion {
        0% { stroke-dashoffset: 48; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes stormAlert {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.4)); }
        50% { transform: scale(1.02); filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.7)); }
      }
      .wave-t1 { animation: towerPulse 2.2s cubic-bezier(0.1, 0.7, 0.1, 1) infinite; }
      .wave-t2 { animation: towerPulse 2.2s cubic-bezier(0.1, 0.7, 0.1, 1) 0.8s infinite; }
      .stream-path { stroke-dasharray: 10, 6; animation: streamMotion 1.4s linear infinite; }
      .alert-box { transform-origin: 490px 245px; animation: stormAlert 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="450" rx="16" fill="url(#bgGrad3)" stroke="#30363d" stroke-width="1.5" />

  <!-- Title Bar -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="26" height="26" rx="13" fill="#38bdf8" fill-opacity="0.2" />
    <text x="13" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text>
    <text x="36" y="19" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" letter-spacing="0.3">STEP 3: 4G BRIDGE UPLOAD &amp; MICRO-BOUNTY INCENTIVE</text>
    
    <rect x="740" y="2" width="220" height="24" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1" />
    <text x="850" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">💰 ₹0.50 BOUNTY PER DELIVERY</text>
  </g>

  <!-- COLUMN 1: TWO SURFACED BRIDGES (x=45, y=65, w=265, h=320) -->
  <g transform="translate(45, 65)">
    <!-- Bridge 1 Card (Top - The Winner) -->
    <g transform="translate(0, 0)">
      <rect width="265" height="150" rx="12" fill="url(#bridgeCardGrad)" stroke="#10b981" stroke-width="1.8" />
      <rect x="0" y="0" width="265" height="32" rx="12" fill="#065f46" />
      <text x="14" y="21" fill="#ecfdf5" font-family="monospace" font-size="11" font-weight="700">Bridge 1: phone-bridge (Rider)</text>
      <rect x="195" y="6" width="60" height="20" rx="4" fill="#047857" />
      <text x="225" y="20" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">4G Online</text>

      <text x="14" y="54" fill="#d1fae5" font-family="monospace" font-size="10">Delivering: <tspan fill="#6ee7b7" font-weight="700">pkt-987</tspan> (T + 0 ms)</text>
      <text x="14" y="74" fill="#a7f3d0" font-family="monospace" font-size="9.5">Header:   <tspan fill="#ffffff">X-Bridge-Node-Id: phone-bridge</tspan></text>
      
      <!-- Micro-Bounty Win Badge -->
      <rect x="14" y="86" width="237" height="24" rx="5" fill="#064e3b" stroke="#34d399" stroke-width="1" />
      <text x="132" y="102" fill="#34d399" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">🏆 EARNS ₹0.50 PROTOCOL BOUNTY</text>

      <rect x="14" y="118" width="237" height="22" rx="4" fill="#047857" />
      <text x="132" y="133" fill="#ecfdf5" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">HTTPS POST /api/bridge/ingest</text>
    </g>

    <!-- Bridge 2 Card (Bottom - Concurrent Duplicate) -->
    <g transform="translate(0, 168)">
      <rect width="265" height="150" rx="12" fill="url(#bridgeCardGrad)" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="0" y="0" width="265" height="32" rx="12" fill="#78350f" fill-opacity="0.6" />
      <text x="14" y="21" fill="#fef3c7" font-family="monospace" font-size="11" font-weight="700">Bridge 2: stranger-2 (Surfaced)</text>
      <rect x="195" y="6" width="60" height="20" rx="4" fill="#92400e" />
      <text x="225" y="20" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">4G Online</text>

      <text x="14" y="54" fill="#d1fae5" font-family="monospace" font-size="10">Delivering: <tspan fill="#fbbf24" font-weight="700">pkt-987</tspan> (T + 2 ms)</text>
      <text x="14" y="74" fill="#a7f3d0" font-family="monospace" font-size="9.5">Header:   <tspan fill="#ffffff">X-Bridge-Node-Id: stranger-2</tspan></text>
      
      <!-- Micro-Bounty Dropped Badge -->
      <rect x="14" y="86" width="237" height="24" rx="5" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
      <text x="132" y="102" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">⏱ DUPLICATE DROPPED (₹0.00)</text>

      <rect x="14" y="118" width="237" height="22" rx="4" fill="#78350f" />
      <text x="132" y="133" fill="#fef3c7" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">HTTPS POST /api/bridge/ingest</text>
    </g>
  </g>

  <!-- COLUMN 2: CENTER INFRASTRUCTURE & STORM WARNING (x=320 to 660) -->
  <!-- 4G Tower Graphic -->
  <g transform="translate(480, 68)">
    <circle cx="20" cy="20" class="wave-t1" fill="none" stroke="#10b981" />
    <circle cx="20" cy="20" class="wave-t2" fill="none" stroke="#34d399" />
    
    <!-- Tower Pole -->
    <path d="M 12 58 L 20 18 L 28 58 Z" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <line x1="10" y1="34" x2="30" y2="34" stroke="#10b981" stroke-width="1.5" />
    <line x1="6" y1="48" x2="34" y2="48" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="18" r="4.5" fill="#10b981" filter="url(#towerGlow)" />
    <text x="20" y="74" fill="#34d399" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">4G / 5G CELL TOWER</text>
  </g>

  <!-- Stream Line A (Top Flight Path - Winner) -->
  <path d="M 315 140 C 440 100, 560 100, 680 140" fill="none" stroke="#10b981" stroke-width="3" class="stream-path" />
  <polygon points="680,135 690,140 680,145" fill="#10b981" />
  <text x="500" y="112" fill="#34d399" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">Stream A (T+0ms) → Wins Lock + Bounty</text>

  <!-- Duplicate Storm Callout (Centered, No Collision) -->
  <g class="alert-box" transform="translate(365, 202)">
    <rect width="270" height="80" rx="10" fill="#78350f" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5" />
    <text x="135" y="24" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚡ OPPORTUNISTIC BRIDGE RACE</text>
    <text x="135" y="44" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">Multiple phones surface with the same packet</text>
    <text x="135" y="60" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">Arrival Δt = 2ms · First arrival gets ₹0.50</text>
    <text x="135" y="74" fill="#f59e0b" font-family="monospace" font-size="8.5" text-anchor="middle">Second arrival safely dropped with 200 OK</text>
  </g>

  <!-- Stream Line B (Bottom Flight Path - Duplicate) -->
  <path d="M 315 310 C 440 348, 560 348, 680 310" fill="none" stroke="#f59e0b" stroke-width="3" class="stream-path" />
  <polygon points="680,305 690,310 680,315" fill="#f59e0b" />
  <text x="500" y="344" fill="#fbbf24" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">Stream B (T+2ms) → Duplicate Dropped (0ms)</text>

  <!-- COLUMN 3: BACKEND INGESTION RECEIVER (x=685, y=65, w=275, h=320) -->
  <g transform="translate(685, 65)">
    <rect width="275" height="320" rx="14" fill="url(#serverCardGrad)" stroke="#818cf8" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="0" y="0" width="275" height="38" rx="14" fill="#312e81" fill-opacity="0.5" />
    <circle cx="20" cy="19" r="4.5" fill="#10b981" />
    <text x="34" y="23" fill="#c7d2fe" font-family="monospace" font-size="12" font-weight="700">zUPI Ingestion Gateway</text>

    <!-- Sub-Box 1: Route Target -->
    <rect x="14" y="48" width="247" height="42" rx="6" fill="#0b0f19" stroke="#30363d" stroke-width="1" />
    <text x="24" y="66" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">POST /api/bridge/ingest</text>
    <text x="24" y="82" fill="#94a3b8" font-family="monospace" font-size="9">X-Bridge-Node-Id authentication</text>

    <!-- Sub-Box 2: Pipeline Steps -->
    <rect x="14" y="98" width="247" height="166" rx="8" fill="#0b0f19" stroke="#30363d" stroke-width="1" />
    <text x="24" y="118" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">INBOUND DISPATCHER</text>
    <line x1="24" y1="126" x2="251" y2="126" stroke="#30363d" stroke-width="1" />

    <text x="24" y="146" fill="#38bdf8" font-family="monospace" font-size="10">1. Compute SHA-256 Hash</text>
    <text x="24" y="168" fill="#fbbf24" font-family="monospace" font-size="10">2. Two-Tier CAS Gate Check</text>
    <text x="24" y="190" fill="#34d399" font-family="monospace" font-size="10">3. Credit ₹0.50 Bounty (Bridge 1)</text>
    <text x="24" y="212" fill="#f87171" font-family="monospace" font-size="10">4. Drop Duplicate (Bridge 2)</text>
    <text x="24" y="234" fill="#a5b4fc" font-family="monospace" font-size="10">5. Return Reverse Settlement ACK</text>
    <text x="24" y="254" fill="#6ee7b7" font-family="monospace" font-size="9">   (Includes status: "SETTLED")</text>

    <!-- Bottom note -->
    <rect x="14" y="272" width="247" height="36" rx="6" fill="#1e293b" />
    <text x="137" y="288" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">GET /api/bridges/rewards</text>
    <text x="137" y="301" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" text-anchor="middle">Instant bridge bounty tracking &amp; payout</text>
  </g>

  <!-- BOTTOM FOOTER CALLOUT (y=398) -->
  <g transform="translate(45, 398)">
    <rect width="915" height="38" rx="8" fill="#0b0f19" stroke="#30363d" stroke-width="1" />
    <text x="24" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">
      💰 <tspan fill="#34d399" font-weight="700">Economic Incentive Layer:</tspan> Strangers gladly relay packets because surfacing earns <tspan fill="#34d399" font-weight="600">₹0.50 per verified delivery</tspan>, turning every citizen into a decentralized payment carrier.
    </text>
  </g>
</svg>
