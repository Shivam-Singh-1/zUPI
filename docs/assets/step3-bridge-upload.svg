<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="uploadGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes towerWave {
        0% { r: 12px; opacity: 0.9; stroke-width: 2; }
        100% { r: 50px; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes uploadFlowA {
        0% { stroke-dashoffset: 240; opacity: 0.3; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes uploadFlowB {
        0% { stroke-dashoffset: 240; opacity: 0.3; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes pulseAlert {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 0 8px rgba(245,158,11,0.6)); }
      }
      .tower-ring-1 { animation: towerWave 2s cubic-bezier(0.1, 0.7, 0.1, 1) infinite; }
      .tower-ring-2 { animation: towerWave 2s cubic-bezier(0.1, 0.7, 0.1, 1) 0.7s infinite; }
      .stream-a { stroke-dasharray: 12, 6; animation: uploadFlowA 1.6s linear infinite; }
      .stream-b { stroke-dasharray: 12, 6; animation: uploadFlowB 1.8s linear infinite; }
      .storm-badge { transform-origin: 470px 170px; animation: pulseAlert 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="340" rx="16" fill="url(#bgGrad3)" stroke="#30363d" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(32, 34)">
    <circle cx="10" cy="10" r="10" fill="#38bdf8" fill-opacity="0.2" />
    <text x="10" y="15" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <text x="32" y="15" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" letter-spacing="0.3">STEP 3: OPPORTUNISTIC 4G BRIDGE UPLOAD &amp; DUPLICATE STORM</text>
    <rect x="710" y="0" width="138" height="22" rx="11" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1" />
    <text x="779" y="15" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" text-anchor="middle">⚡ 4G / 5G CONNECTED</text>
  </g>

  <!-- Left: Two Bridge Nodes Emerging to 4G -->
  <!-- Bridge Node 1 -->
  <g transform="translate(48, 80)">
    <rect width="210" height="100" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="16" y="24" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="700">phone-bridge (Rider)</text>
    <rect x="135" y="10" width="60" height="18" rx="4" fill="#047857" />
    <text x="165" y="23" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">4G Online</text>
    <text x="16" y="52" fill="#d1fae5" font-family="monospace" font-size="10">Holding: pkt-987 (TTL=1)</text>
    <text x="16" y="74" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Delivering at T+0ms</text>
  </g>

  <!-- Bridge Node 2 (Concurrent Stranger Surfacing) -->
  <g transform="translate(48, 200)">
    <rect width="210" height="100" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="16" y="24" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="700">stranger-2 (Surfaced)</text>
    <rect x="135" y="10" width="60" height="18" rx="4" fill="#047857" />
    <text x="165" y="23" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">4G Online</text>
    <text x="16" y="52" fill="#d1fae5" font-family="monospace" font-size="10">Holding: pkt-987 (TTL=2)</text>
    <text x="16" y="74" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Delivering at T+2ms</text>
  </g>

  <!-- Cellular Tower Graphics in Middle -->
  <g transform="translate(320, 140)">
    <circle cx="20" cy="20" class="tower-ring-1" fill="none" stroke="#10b981" />
    <circle cx="20" cy="20" class="tower-ring-2" fill="none" stroke="#34d399" />
    <!-- Tower Pole -->
    <path d="M 12 70 L 20 20 L 28 70 Z" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <line x1="10" y1="45" x2="30" y2="45" stroke="#10b981" stroke-width="1.5" />
    <line x1="6" y1="60" x2="34" y2="60" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="18" r="4" fill="#10b981" filter="url(#uploadGlow)" />
    <text x="20" y="88" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">4G TOWER</text>
  </g>

  <!-- Concurrent Flight Paths from Bridges to Backend -->
  <!-- Stream A -->
  <path d="M 258 130 C 370 110, 480 110, 590 145" fill="none" stroke="#10b981" stroke-width="3" class="stream-a" />
  <polygon points="590,140 600,145 590,150" fill="#10b981" />

  <!-- Stream B -->
  <path d="M 258 250 C 370 270, 480 250, 590 195" fill="none" stroke="#f59e0b" stroke-width="3" class="stream-b" />
  <polygon points="590,190 600,195 590,200" fill="#f59e0b" />

  <!-- Duplicate Storm Badge in Middle Air -->
  <g class="storm-badge" transform="translate(380, 150)">
    <rect width="180" height="42" rx="8" fill="#78350f" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5" />
    <text x="90" y="18" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" text-anchor="middle">⚠️ CONCURRENT STORM</text>
    <text x="90" y="32" fill="#fde68a" font-family="monospace" font-size="9" text-anchor="middle">Identical Ciphertexts</text>
  </g>

  <!-- Right: Express Backend Ingestion Endpoint -->
  <g transform="translate(605, 80)">
    <rect width="235" height="220" rx="14" fill="url(#serverGrad)" stroke="#818cf8" stroke-width="1.5" />
    <rect x="0" y="0" width="235" height="36" rx="14" fill="#312e81" fill-opacity="0.5" />
    <circle cx="20" cy="18" r="4" fill="#10b981" />
    <text x="32" y="22" fill="#c7d2fe" font-family="monospace" font-size="11" font-weight="700">zUPI Express Server</text>

    <!-- Ingest Route Detail -->
    <rect x="14" y="48" width="207" height="42" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <text x="22" y="65" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">POST /api/bridge/ingest</text>
    <text x="22" y="80" fill="#94a3b8" font-family="monospace" font-size="9">X-Bridge-Node-Id: phone-bridge</text>

    <!-- Pipeline Queued Actions -->
    <rect x="14" y="100" width="207" height="100" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <text x="22" y="120" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Incoming Handlers:</text>
    <text x="22" y="140" fill="#38bdf8" font-family="monospace" font-size="9">1. SHA-256(ciphertext)</text>
    <text x="22" y="160" fill="#f59e0b" font-family="monospace" font-size="9">2. Idempotency Gate (CAS)</text>
    <text x="22" y="180" fill="#10b981" font-family="monospace" font-size="9">3. First Settles / Second Drops</text>
  </g>
</svg>
