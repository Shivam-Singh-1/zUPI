<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="bridgeCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="serverCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="towerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes towerPulse {
        0% { r: 10px; opacity: 0.9; stroke-width: 2.5; }
        100% { r: 44px; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes streamMotion {
        0% { stroke-dashoffset: 48; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes stormAlert {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.4)); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.8)); }
      }
      .wave-t1 { animation: towerPulse 2.2s cubic-bezier(0.1, 0.7, 0.1, 1) infinite; }
      .wave-t2 { animation: towerPulse 2.2s cubic-bezier(0.1, 0.7, 0.1, 1) 0.8s infinite; }
      .stream-path { stroke-dasharray: 10, 6; animation: streamMotion 1.4s linear infinite; }
      .alert-box { transform-origin: 490px 230px; animation: stormAlert 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="420" rx="16" fill="url(#bgGrad3)" stroke="#30363d" stroke-width="1.5" />

  <!-- Title Bar -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="26" height="26" rx="13" fill="#38bdf8" fill-opacity="0.2" />
    <text x="13" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text>
    <text x="36" y="19" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" letter-spacing="0.3">STEP 3: 4G BRIDGE UPLOAD &amp; CONCURRENT DUPLICATE STORM</text>
    
    <rect x="760" y="2" width="200" height="24" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1" />
    <text x="860" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚡ 4G/5G OPPORTUNISTIC HIT</text>
  </g>

  <!-- COLUMN 1: TWO SURFACED BRIDGES (x=50, y=70, w=250, h=310) -->
  <g transform="translate(50, 70)">
    <!-- Bridge 1 Card (Top) -->
    <g transform="translate(0, 0)">
      <rect width="250" height="135" rx="12" fill="url(#bridgeCardGrad)" stroke="#10b981" stroke-width="1.5" />
      <rect x="0" y="0" width="250" height="30" rx="12" fill="#065f46" />
      <text x="14" y="20" fill="#ecfdf5" font-family="monospace" font-size="11" font-weight="700">Bridge 1: phone-bridge (Rider)</text>
      <rect x="180" y="6" width="60" height="18" rx="4" fill="#047857" />
      <text x="210" y="19" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">4G Active</text>

      <text x="14" y="52" fill="#d1fae5" font-family="monospace" font-size="10">Delivering: <tspan fill="#6ee7b7" font-weight="700">pkt-987</tspan></text>
      <text x="14" y="72" fill="#a7f3d0" font-family="monospace" font-size="10">Timestamp:  <tspan fill="#ffffff">T + 0 ms</tspan></text>
      <text x="14" y="92" fill="#94a3b8" font-family="monospace" font-size="9">Header: X-Bridge-Node-Id</text>

      <rect x="14" y="104" width="222" height="20" rx="4" fill="#047857" />
      <text x="125" y="118" fill="#ecfdf5" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">HTTPS POST /api/bridge/ingest</text>
    </g>

    <!-- Bridge 2 Card (Bottom) -->
    <g transform="translate(0, 160)">
      <rect width="250" height="135" rx="12" fill="url(#bridgeCardGrad)" stroke="#10b981" stroke-width="1.5" />
      <rect x="0" y="0" width="250" height="30" rx="12" fill="#065f46" />
      <text x="14" y="20" fill="#ecfdf5" font-family="monospace" font-size="11" font-weight="700">Bridge 2: stranger-2 (Surfaced)</text>
      <rect x="180" y="6" width="60" height="18" rx="4" fill="#047857" />
      <text x="210" y="19" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">4G Active</text>

      <text x="14" y="52" fill="#d1fae5" font-family="monospace" font-size="10">Delivering: <tspan fill="#6ee7b7" font-weight="700">pkt-987</tspan></text>
      <text x="14" y="72" fill="#a7f3d0" font-family="monospace" font-size="10">Timestamp:  <tspan fill="#fbbf24">T + 2 ms</tspan> (Concurrent)</text>
      <text x="14" y="92" fill="#94a3b8" font-family="monospace" font-size="9">Header: X-Bridge-Node-Id</text>

      <rect x="14" y="104" width="222" height="20" rx="4" fill="#047857" />
      <text x="125" y="118" fill="#ecfdf5" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">HTTPS POST /api/bridge/ingest</text>
    </g>
  </g>

  <!-- COLUMN 2: CENTER INFRASTRUCTURE & STORM WARNING (x=330 to 650) -->
  <!-- 4G Tower Graphic -->
  <g transform="translate(470, 75)">
    <circle cx="20" cy="20" class="wave-t1" fill="none" stroke="#10b981" />
    <circle cx="20" cy="20" class="wave-t2" fill="none" stroke="#34d399" />
    
    <!-- Tower Pole -->
    <path d="M 12 60 L 20 18 L 28 60 Z" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <line x1="10" y1="36" x2="30" y2="36" stroke="#10b981" stroke-width="1.5" />
    <line x1="6" y1="50" x2="34" y2="50" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="18" r="4.5" fill="#10b981" filter="url(#towerGlow)" />
    <text x="20" y="76" fill="#34d399" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">4G BASE TOWER</text>
  </g>

  <!-- Stream Line A (Top Flight Path) -->
  <path d="M 300 135 C 440 100, 560 100, 680 135" fill="none" stroke="#10b981" stroke-width="3" class="stream-path" />
  <polygon points="680,130 690,135 680,140" fill="#10b981" />
  <text x="490" y="110" fill="#34d399" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">Delivery Stream A (T+0ms)</text>

  <!-- Duplicate Storm Callout (Centered, No Collision) -->
  <g class="alert-box" transform="translate(370, 195)">
    <rect width="240" height="74" rx="10" fill="#78350f" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5" />
    <text x="120" y="24" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚠️ CONCURRENT DUPLICATE STORM</text>
    <text x="120" y="44" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">Two phones upload identical ciphertexts</text>
    <text x="120" y="62" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">Arrival Δt = 2 milliseconds</text>
  </g>

  <!-- Stream Line B (Bottom Flight Path) -->
  <path d="M 300 295 C 440 330, 560 330, 680 295" fill="none" stroke="#f59e0b" stroke-width="3" class="stream-path" />
  <polygon points="680,290 690,295 680,300" fill="#f59e0b" />
  <text x="490" y="322" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">Delivery Stream B (T+2ms)</text>

  <!-- COLUMN 3: BACKEND INGESTION RECEIVER (x=680, y=70, w=270, h=310) -->
  <g transform="translate(680, 70)">
    <rect width="270" height="310" rx="14" fill="url(#serverCardGrad)" stroke="#818cf8" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="0" y="0" width="270" height="38" rx="14" fill="#312e81" fill-opacity="0.5" />
    <circle cx="20" cy="19" r="4.5" fill="#10b981" />
    <text x="34" y="23" fill="#c7d2fe" font-family="monospace" font-size="12" font-weight="700">zUPI Express Server</text>

    <!-- Sub-Box 1: Route Target -->
    <rect x="14" y="48" width="242" height="42" rx="6" fill="#0b0f19" stroke="#30363d" stroke-width="1" />
    <text x="24" y="66" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">POST /api/bridge/ingest</text>
    <text x="24" y="82" fill="#94a3b8" font-family="monospace" font-size="9">Header parsing &amp; payload extraction</text>

    <!-- Sub-Box 2: Pipeline Steps -->
    <rect x="14" y="100" width="242" height="150" rx="8" fill="#0b0f19" stroke="#30363d" stroke-width="1" />
    <text x="24" y="122" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">INBOUND DISPATCHER</text>
    <line x1="24" y1="130" x2="246" y2="130" stroke="#30363d" stroke-width="1" />

    <text x="24" y="152" fill="#38bdf8" font-family="monospace" font-size="10">1. Compute SHA-256 Hash</text>
    <text x="24" y="176" fill="#fbbf24" font-family="monospace" font-size="10">2. Route to CAS Gate</text>
    <text x="24" y="200" fill="#34d399" font-family="monospace" font-size="10">3. Claim or Drop in 0ms</text>
    <text x="24" y="224" fill="#cbd5e1" font-family="monospace" font-size="10">4. Zero-wait event loop</text>

    <!-- Bottom note -->
    <rect x="14" y="262" width="242" height="34" rx="6" fill="#1e293b" />
    <text x="135" y="278" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" text-anchor="middle">Handles parallel bridge delivery</text>
    <text x="135" y="290" fill="#34d399" font-family="monospace" font-size="8" font-weight="600" text-anchor="middle">Guarantees exactly-once execution</text>
  </g>
</svg>
